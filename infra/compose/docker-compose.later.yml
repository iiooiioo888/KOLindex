# 後期服務定義已併入 docker-compose.yml（profile: later）。
# 第一版不要開。Redis 等 Celery；MinIO 不進第一版真相面。
#
# 新指令：
#   docker compose -p kolindex --profile later up -d
#   node scripts/nas/compose-smart.mjs --profiles later --allow-later
#
# 本檔保留給舊文件連結；覆寫仍掛 later profile，避免誤開。
name: kolindex

services:
  redis:
    profiles: ["later"]
  minio:
    profiles: ["later"]

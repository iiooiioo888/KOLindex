# 相容覆寫：舊指令
#   docker compose -f docker-compose.yml -f docker-compose.oss.yml up -d
# 會把 OSS／backup 服務的 profiles 清掉，行為等同以前「跟主檔一起全開」。
# 新指令請改用：
#   docker compose -p kolindex --profile oss up -d
#   docker compose -p kolindex --profile oss --profile backup up -d
# 服務本體定義只在 docker-compose.yml。

name: kolindex

services:
  sherlock:
    profiles: []
  xhs-downloader:
    profiles: []
  douyin-tiktok-api:
    profiles: []
  maigret:
    profiles: []

# KOL-Index Compose 單一真相
# ─────────────────────────────────────────────────────────────
# 預設（core）：web + postgres + meilisearch
#   docker compose -p kolindex up -d
#
# 開源工具（不進 data 網路）：
#   docker compose -p kolindex --profile oss up -d
#   docker compose -p kolindex --profile oss --profile backup up -d   # 含 Maigret
#
# 後期（Celery／物件儲存候選，第一版勿開）：
#   docker compose -p kolindex --profile later up -d
#
# 舊指令仍可用：
#   -f docker-compose.yml -f docker-compose.oss.yml
#   -f docker-compose.yml -f docker-compose.later.yml
# 智慧啟動（核對架構 → config → up → ps）：
#   node scripts/nas/compose-smart.mjs
#   node scripts/nas/compose-smart.mjs --profiles oss
# ─────────────────────────────────────────────────────────────
name: kolindex

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-harden-oss: &harden-oss
  read_only: true
  init: true
  pull_policy: if_not_present
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *logging
  networks:
    - oss

services:
  # ── core（無 profile＝預設啟動）────────────────────────────
  web:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    image: kolindex-site:2026.11.24
    pull_policy: build
    ports:
      - "${WEB_BIND:-127.0.0.1}:5200:5200"
    environment:
      HOST: "0.0.0.0"
      PORT: "5200"
      NODE_ENV: production
      TZ: ${TZ:-Asia/Taipei}
      KOL_PROD: "1"
      KOL_GATE: ${KOL_GATE:?set KOL_GATE in infra/compose/.env}
      KOL_ROLE: ${KOL_ROLE:-viewer}
      KOL_OPERATOR: ${KOL_OPERATOR:-}
      KOL_COOKIE_SECURE: ${KOL_COOKIE_SECURE:-0}
      KOL_API: ${KOL_API:-http://host.docker.internal:5210}
      KOL_MEDIA_ROOT: /nas/media
      KOL_DOCKER: "0"
      KOL_SHERLOCK: "0"
      KOL_LLM: "0"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: kolindex
      POSTGRES_USER: kolindex
      MEILI_HOST: http://meilisearch:7700
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    volumes:
      - ${KOL_NAS_ROOT:-../../data/nas}/media:/nas/media:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    init: true
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    cpus: ${WEB_CPUS:-0.50}
    pids_limit: 128
    logging: *logging
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5200/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 8s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      org.kolindex.profile: core
      org.kolindex.role: edge
    networks:
      - edge
      - data
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    pull_policy: if_not_present
    environment:
      TZ: ${TZ:-Asia/Taipei}
      PGTZ: ${TZ:-Asia/Taipei}
      POSTGRES_USER: kolindex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/compose/.env}
      POSTGRES_DB: kolindex
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=${PG_LOG_MIN_DURATION_MS:-0}
    volumes:
      - ${KOL_NAS_ROOT:-../../data/nas}/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 128mb
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    cpus: ${POSTGRES_CPUS:-1.00}
    pids_limit: 256
    logging: *logging
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kolindex -d kolindex"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    labels:
      org.kolindex.profile: core
      org.kolindex.role: truth
    networks:
      - data
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.57.0@sha256:91bf09897482c17205c8faeca8daa8d57999fb9de20d862763cdfa92ba4ec790
    pull_policy: if_not_present
    environment:
      TZ: ${TZ:-Asia/Taipei}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_LOG_LEVEL: ${MEILI_LOG_LEVEL:-INFO}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in infra/compose/.env}
    ports:
      - "${MEILI_BIND:-127.0.0.1}:7700:7700"
    volumes:
      - ${KOL_NAS_ROOT:-../../data/nas}/meili:/meili_data
    mem_limit: ${MEILI_MEM_LIMIT:-512m}
    cpus: ${MEILI_CPUS:-0.50}
    pids_limit: 128
    logging: *logging
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    labels:
      org.kolindex.profile: core
      org.kolindex.role: derived
    networks:
      - data
    restart: unless-stopped

  # ── profile: oss（不進 data；開機不抓取）───────────────────
  sherlock:
    <<: *harden-oss
    profiles: ["oss"]
    image: sherlock/sherlock@sha256:9d6602b98179fb15ceab88433626fb0ae603ae9880e13cab886970317fe1475f
    environment:
      TZ: ${TZ:-Asia/Taipei}
    mem_limit: ${SHERLOCK_MEM_LIMIT:-512m}
    memswap_limit: ${SHERLOCK_MEM_LIMIT:-512m}
    cpus: ${SHERLOCK_CPUS:-0.50}
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    entrypoint: ["sleep", "infinity"]
    restart: unless-stopped
    labels:
      org.kolindex.profile: oss
      org.kolindex.tag: "0.16.0"
      org.kolindex.measured: "2026-11-24"
      org.kolindex.wait: control

  xhs-downloader:
    <<: *harden-oss
    profiles: ["oss"]
    image: joeanamier/xhs-downloader@sha256:5878c0972cc1236cd8ac4e069f9202152434d8402df52bf427210229b8a53fb9
    environment:
      TZ: ${TZ:-Asia/Taipei}
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "${XHS_BIND:-127.0.0.1}:${XHS_PORT:-5556}:5556"
    volumes:
      - ${KOL_NAS_ROOT:-../../data/nas}/oss/xhs:/app/Volume
    mem_limit: ${XHS_MEM_LIMIT:-512m}
    memswap_limit: ${XHS_MEM_LIMIT:-512m}
    cpus: ${XHS_CPUS:-0.50}
    pids_limit: 128
    tmpfs:
      - /tmp:rw,nosuid,size=32m
    restart: "on-failure:2"
    labels:
      org.kolindex.profile: oss
      org.kolindex.tag: "2.8"
      org.kolindex.measured: "2026-11-24"
      org.kolindex.wait: control

  douyin-tiktok-api:
    <<: *harden-oss
    profiles: ["oss"]
    image: evil0ctal/douyin_tiktok_download_api@sha256:c0907e1bf08f4b7eda0a79c8157b29523a0b28f63bb26670bf666f4c88f50c00
    command: ["api"]
    environment:
      TZ: ${TZ:-Asia/Taipei}
      PYTHONDONTWRITEBYTECODE: "1"
      DTK_BIND_HOST: "0.0.0.0"
      DTK_BIND_PORT: "8000"
    ports:
      - "${DTK_BIND:-127.0.0.1}:${DTK_PORT:-8000}:8000"
    volumes:
      - ${KOL_NAS_ROOT:-../../data/nas}/oss/dtk/backups:/var/lib/dtk/backups
    mem_limit: ${DTK_MEM_LIMIT:-512m}
    memswap_limit: ${DTK_MEM_LIMIT:-512m}
    cpus: ${DTK_CPUS:-1.00}
    pids_limit: 256
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    stop_grace_period: 20s
    restart: "on-failure:2"
    labels:
      org.kolindex.profile: oss
      org.kolindex.tag: "5.1.13"
      org.kolindex.measured: "2026-11-24"
      org.kolindex.wait: control

  # ── profile: backup（Maigret；不與 Sherlock 同為預設維護面）─
  maigret:
    <<: *harden-oss
    profiles: ["backup"]
    image: soxoj/maigret@sha256:0dba1e81178a4ce62bc73167ae68687217320ebb62b59ced094ba3cb879615e7
    environment:
      TZ: ${TZ:-Asia/Taipei}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${KOL_NAS_ROOT:-../../data/nas}/oss/maigret:/app/reports
    mem_limit: ${MAIGRET_MEM_LIMIT:-512m}
    memswap_limit: ${MAIGRET_MEM_LIMIT:-512m}
    cpus: ${MAIGRET_CPUS:-0.50}
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    entrypoint: ["sleep", "infinity"]
    restart: unless-stopped
    labels:
      org.kolindex.profile: backup
      org.kolindex.tag: "327c2bc"
      org.kolindex.measured: "2026-11-24"
      org.kolindex.role: backup
      org.kolindex.wait: control

  # ── profile: later（第一版不啟動）─────────────────────────
  redis:
    profiles: ["later"]
    image: redis:7.4.7-bookworm@sha256:976ab0f0939b78c06d802bcd3bea44c5142ea9a756a57b861e08819817f768c8
    pull_policy: if_not_present
    environment:
      TZ: ${TZ:-Asia/Taipei}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/compose/.env}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/compose/.env}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${REDIS_BIND:-127.0.0.1}:6379:6379"
    volumes:
      - ${KOL_NAS_ROOT:-../../data/nas}/redis:/data
    mem_limit: ${REDIS_MEM_LIMIT:-192m}
    cpus: ${REDIS_CPUS:-0.50}
    pids_limit: 128
    logging: *logging
    restart: "no"
    security_opt:
      - no-new-privileges:true
    labels:
      org.kolindex.profile: later
      org.kolindex.role: broker
    networks:
      - later

  minio:
    profiles: ["later"]
    image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    pull_policy: if_not_present
    environment:
      TZ: ${TZ:-Asia/Taipei}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kolindex}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/compose/.env}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_BIND:-127.0.0.1}:9000:9000"
      - "${MINIO_BIND:-127.0.0.1}:9001:9001"
    volumes:
      - ${KOL_NAS_ROOT:-../../data/nas}/minio:/data
    mem_limit: ${MINIO_MEM_LIMIT:-512m}
    cpus: ${MINIO_CPUS:-0.50}
    pids_limit: 256
    logging: *logging
    restart: "no"
    security_opt:
      - no-new-privileges:true
    labels:
      org.kolindex.profile: later
      org.kolindex.role: object-store-candidate
    networks:
      - later

networks:
  edge: {}
  data:
    internal: true
  oss: {}
  later:
    internal: true

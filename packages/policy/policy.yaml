version: "2026-11-26.1"
max_failures: 2
relation_whitelist:
  - mention
  - collection
  - citation
  - same_stage
rate_limit_per_minute: 30
kill_switch: false
label_whitelist:
  - text
  - object
  - logo
  - scene
  - safety
media_similarity_threshold: 0.9999
media_link_kinds:
  - near_duplicate
  - copy_suspect
media_link_auto_confirm: false
time_fact_sources:
  - public_post
time_candidate_sources:
  - file_time
place_fact_sources:
  - public_post
place_blocked_sources:
  - file_place
task_states:
  - queued
  - running
  - succeeded
  - failed
  - stopped
  - timeout
  - cancelled
  - waiting_review

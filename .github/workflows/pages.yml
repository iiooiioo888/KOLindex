name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 靜態檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 語法檢查
        run: |
          for f in js/*.js; do node --check "$f"; echo "ok $f"; done
      - name: 起本機靜態站（測試要打 5200）
        run: |
          node tests/dev-server.mjs . 5200 > /tmp/dev-server.log 2>&1 &
          for i in $(seq 1 50); do curl -sf -o /dev/null http://127.0.0.1:5200/ && break; sleep 0.2; done
          curl -sf -o /dev/null http://127.0.0.1:5200/ || { cat /tmp/dev-server.log; exit 1; }
      - name: 線框圖渲染器
        run: node tests/test-wireframe.js
      - name: 站台輸出與分頁註冊
        run: node tests/test-page.mjs
      - name: 設計系統四層
        run: node tests/test-ds.mjs
      - name: HTML 標籤配對
        run: node tests/test-balance.mjs
      - name: 角色能力（401／403）
        run: node tests/test-authz.mjs
      - name: 前端依 caps 收起按鈕
        run: node tests/test-caps.mjs
      - name: API 認證閘
        run: node tests/test-api-auth.mjs
      - name: 伺服器日誌
        if: always()
        run: cat /tmp/dev-server.log || true

  deploy:
    name: 部署 GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # GITHUB_TOKEN 沒有管理員權限，開不了 Pages。這裡先問 API，沒開就跳過發佈並留 notice，
      # 讓 CI 保持綠色；到 Settings → Pages → Source 選「GitHub Actions」後重跑即可發佈。
      - name: 檢查 Pages 是否已啟用
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/pages")
          echo "Pages API: $code"
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages 還沒啟用（Settings → Pages → Source 選 GitHub Actions），這次只跑檢查、不發佈。"
          fi
      - name: 整理要發佈的檔案
        if: steps.pages.outputs.enabled == 'true'
        run: |
          mkdir -p _site
          cp index2.html _site/
          cp -r css js fonts _site/
      - name: 上傳 artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 發佈
        if: steps.pages.outputs.enabled == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
        # 沒開 Pages 時 deploy-pages 會失敗（API 404）；不要讓整個 CI 變紅。
        # 開了 Pages 之後這一步就會真的發佈，warning 消失。
        continue-on-error: true
